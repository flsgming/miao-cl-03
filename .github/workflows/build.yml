name: MiaoBuildCL Universal iOS Port Builder

on:
  workflow_dispatch:
    inputs:
      chip_preset:
        description: "Preset chip (under_a17 = Smart A16 ASTC, a17_plus = build gốc)"
        type: choice
        options:
          - under_a17
          - a17_plus
        default: under_a17
      packaging_mode:
        description: "Chế độ đóng gói (separate_both / bundle / separate_ipa_only)"
        type: choice
        options:
          - separate_both
          - bundle
          - separate_ipa_only
        default: separate_both
      engine_repo:
        description: "URL repo engine"
        required: false
        default: "https://github.com/zenvyzenshiro/NXNativeWindows.git"
      ipa_name:
        description: "Tên file IPA đầu ra"
        required: false
        default: "GamePort_miao.ipa"
      credit_text:
        description: "Credit hiển thị kèm icon mèo"
        required: false
        default: "Port by Miaomiaocutene"
      title_id:
        description: "Title ID (tùy chọn cho patch 60 FPS)"
        required: false
        default: ""
      use_update:
        description: "Tải thêm Update từ secret UPDATE_URL"
        type: boolean
        default: false
      use_vh:
        description: "Chèn gói Việt hóa từ secret VH_URL"
        type: boolean
        default: false
      enable_60fps:
        description: "Mở khóa 60 FPS trong game.tsv"
        type: boolean
        default: true
      enable_ram_unlock:
        description: "Mở khóa thêm RAM (Increased Memory Limit)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Homebrew dependencies & Metal Toolchain
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross glslang jq p7zip
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Setup .NET 10 SDK (arm64)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup .NET 10 Runtime (x64 for Rosetta tools)
        run: |
          set -euo pipefail
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --runtime dotnet --architecture x64 --install-dir "$HOME/.dotnet-x64"
          echo "DOTNET_ROOT_ARM64=$DOTNET_ROOT" >> "$GITHUB_ENV"
          echo "DOTNET_ROOT_X64=$HOME/.dotnet-x64" >> "$GITHUB_ENV"
          echo "DOTNET_ROLL_FORWARD=Major" >> "$GITHUB_ENV"

      - name: Clone Engine & Smart A16 Auto-Patch + Options + Miao Credit
        env:
          CHIP_PRESET: ${{ inputs.chip_preset }}
          ENGINE_REPO: ${{ inputs.engine_repo }}
          TITLE_ID: ${{ inputs.title_id }}
          ENABLE_60FPS: ${{ inputs.enable_60fps }}
          ENABLE_RAM: ${{ inputs.enable_ram_unlock }}
          CREDIT_TEXT: ${{ inputs.credit_text }}
        run: |
          set -euo pipefail
          git clone --depth 1 "$ENGINE_REPO" src
          if [ -f "src/tools/engine.py" ] && [ ! -f "src/scripts/build_ipa_from_nsp.py" ]; then
            echo "[NX2Apple] Phát hiện cấu trúc wrapper -> chạy tools/engine.py sync..."
            (cd src && python3 tools/engine.py sync)
            mv src src_wrapper
            mv src_wrapper/engine src
            rm -rf src_wrapper
          fi

          # 1. Smart A16 Auto-Patch (tự phát hiện engine đã có BC mềm hay cần ghép từ NXNativeWindows / patch_a16.py)
          if [ "$CHIP_PRESET" = "under_a17" ]; then
            if [ -f "src/dm/gfx/tex/bc_soft.c" ] || [ -f "src/dm/gfx/tex/nvn_bcdec.c" ]; then
              echo "[A16 SMART] Engine đã tích hợp sẵn giải mã BC mềm cho A16."
            else
              echo "[A16 SMART] Engine gốc (upstream) chưa có giải mã BC mềm -> tiến hành ghép thông minh..."
              CUSTOM_PATCH="$(find . -maxdepth 3 -name "patch_a16*.py" -not -path "./src/*" | head -n 1)"
              if [ -n "$CUSTOM_PATCH" ]; then
                git clone --depth 1 https://github.com/Jeb0978/fifa22-nxnative.git tmp_a16
                cp -v tmp_a16/dm/gfx/tex/*bcdec* src/dm/gfx/tex/ || true
                rm -rf tmp_a16
                python3 "$CUSTOM_PATCH" src
              else
                echo "[A16 SMART] Kéo bộ giải mã ASTC (bc_soft) từ NXNativeWindows..."
                git clone --depth 1 https://github.com/zenvyzenshiro/NXNativeWindows.git tmp_nxw
                cp -v tmp_nxw/dm/gfx/tex/bc_soft.* src/dm/gfx/tex/ || true
                python3 - <<'PY'
          import os, re, shutil
          # Kiểm tra & tự động đăng ký bc_soft.c vào build_ipa.sh / Makefile nếu chưa có
          for rel in ("src/dm/host/Makefile", "src/dm/ios/tools/build_ipa.sh"):
              if os.path.isfile(rel):
                  txt = open(rel, encoding="utf-8").read()
                  if "bc_soft.c" not in txt and "tex_layout.c" in txt:
                      txt = txt.replace("tex_layout.c", "tex_layout.c bc_soft.c", 1)
                      open(rel, "w", encoding="utf-8").write(txt)
                      print(f"[A16 SMART] Registered bc_soft.c in {rel}")
          # Báo trạng thái hook nvn_mtl.m
          mtl = "src/dm/gfx/nvn/nvn_mtl.m"
          if os.path.isfile(mtl):
              mtxt = open(mtl, encoding="utf-8").read()
              if "bc_soft" not in mtxt:
                  print("[A16 SMART WARN] Upstream nvn_mtl.m chưa có hook bc_soft; khuyến nghị thêm patch_a16.py hoặc dùng NXNativeWindows cho game nặng.")
          PY
                rm -rf tmp_nxw
              fi
            fi
          else
            echo "[INFO] Preset A17 Pro trở lên -> build nguyên bản (BC phần cứng)"
          fi

          # 2. Vá lỗi linker _nxw_show_data_help khi build fork NXNativeWindows trên macOS/Xcode
          if [ -f "src/dm/host/front_ios.m" ]; then
            python3 - <<'PY'
          path = "src/dm/host/front_ios.m"
          code = open(path, encoding="utf-8").read()
          if "nxw_show_data_help" in code and "miao_weak_nxw_show_data_help" not in code:
              open(path, "w", encoding="utf-8").write(code + "\n/* miao_weak_nxw_show_data_help */\n__attribute__((weak)) void nxw_show_data_help(void) {}\n")
              print("[PATCH] Added weak stub for nxw_show_data_help")
          PY
          fi

          # 3. Mở khóa 60 FPS nếu game có profile sẵn
          if [ "$ENABLE_60FPS" = "true" ] && [ -n "$TITLE_ID" ] && [ -f "src/dm/games/$TITLE_ID/game.tsv" ]; then
            python3 - <<'PY'
          import os
          tsv = f"src/dm/games/{os.environ['TITLE_ID']}/game.tsv"
          lines = open(tsv, encoding="utf-8").read().splitlines()
          overrides = {"present_interval": "display", "fps_target": "60"}
          seen, out = set(), []
          for ln in lines:
              s = ln.strip()
              if s and not s.startswith("#") and s.split()[0] in overrides:
                  k = s.split()[0]
                  out.append(f"{k}\t{overrides[k]}")
                  seen.add(k)
              else:
                  out.append(ln)
          for k, v in overrides.items():
              if k not in seen:
                  out.append(f"{k}\t{v}")
          open(tsv, "w", encoding="utf-8").write("\n".join(out) + "\n")
          PY
          fi

          # 4. Entitlements mở khóa RAM
          if [ "$ENABLE_RAM" = "true" ]; then
            cat > entitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.kernel.increased-memory-limit</key>
            <true/>
          </dict>
          </plist>
          EOF
            plutil -lint entitlements.plist
          fi

          # 5. Nhúng Credit + icon đầu mèo SwiftUI vào Launcher.swift
          if [ -f "src/dm/ios/Sources/Launcher.swift" ]; then
            python3 - <<'PY'
          import os, re
          launcher = "src/dm/ios/Sources/Launcher.swift"
          credit = os.environ.get("CREDIT_TEXT", "Port by Miaomiaocutene").replace('"', '\\"')
          code = open(launcher, encoding="utf-8").read()
          if "MiaoCreditBadge" not in code:
              m = re.search(r'(var\s+body\s*:\s*some\s+View\s*\{)', code)
              if m:
                  hook = "var body: some View { miaoWrapView(miaoOriginalBody) }\n    @ViewBuilder private var miaoOriginalBody: some View {"
                  code = code[:m.start()] + hook + code[m.end():]
                  code += f'''
          private struct MiaoCatHeadShape: Shape {{
              func path(in rect: CGRect) -> Path {{
                  let w = rect.width, h = rect.height
                  var p = Path()
                  p.move(to: CGPoint(x: w * 0.16, y: h * 0.44))
                  p.addLine(to: CGPoint(x: w * 0.22, y: h * 0.10))
                  p.addLine(to: CGPoint(x: w * 0.40, y: h * 0.28))
                  p.addQuadCurve(to: CGPoint(x: w * 0.60, y: h * 0.28), control: CGPoint(x: w * 0.50, y: h * 0.24))
                  p.addLine(to: CGPoint(x: w * 0.78, y: h * 0.10))
                  p.addLine(to: CGPoint(x: w * 0.84, y: h * 0.44))
                  p.addCurve(to: CGPoint(x: w * 0.50, y: h * 0.90), control1: CGPoint(x: w * 0.90, y: h * 0.72), control2: CGPoint(x: w * 0.72, y: h * 0.90))
                  p.addCurve(to: CGPoint(x: w * 0.16, y: h * 0.44), control1: CGPoint(x: w * 0.28, y: h * 0.90), control2: CGPoint(x: w * 0.10, y: h * 0.72))
                  p.closeSubpath()
                  return p
              }}
          }}
          private struct MiaoCatIconView: View {{
              var body: some View {{
                  ZStack {{
                      MiaoCatHeadShape().fill(Color.pink.opacity(0.92))
                      MiaoCatHeadShape().stroke(Color.white.opacity(0.9), lineWidth: 1.2)
                      HStack(spacing: 4) {{
                          Circle().fill(Color.black).frame(width: 2.6, height: 2.6)
                          Circle().fill(Color.black).frame(width: 2.6, height: 2.6)
                      }}.offset(y: 0.5)
                      Circle().fill(Color.white).frame(width: 2.2, height: 2.2).offset(y: 3.5)
                  }}.frame(width: 18, height: 18)
              }}
          }}
          private struct MiaoCreditBadge: View {{
              var body: some View {{
                  HStack(spacing: 6) {{
                      MiaoCatIconView()
                      Text("{credit}").font(.caption2.weight(.semibold)).foregroundColor(.white)
                  }}
                  .padding(.horizontal, 10).padding(.vertical, 5)
                  .background(Color.black.opacity(0.55)).clipShape(Capsule())
                  .overlay(Capsule().stroke(Color.pink.opacity(0.65), lineWidth: 1))
                  .allowsHitTesting(false)
              }}
          }}
          private func miaoWrapView<V: View>(_ content: V) -> some View {{
              ZStack(alignment: .bottomTrailing) {{ content; MiaoCreditBadge().padding(.trailing, 12).padding(.bottom, 10) }}
          }}
          '''
                  open(launcher, "w", encoding="utf-8").write(code)
          PY
          fi

          chmod +x src/dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate 2>/dev/null || true
          chmod +x src/dm/gfx/tools/spirv_cross_bin/spirv-cross 2>/dev/null || true
          chmod +x src/dm/tools/nx_extract_bin/nx_extract 2>/dev/null || true
          find src -type f -name "*.sh" -exec chmod +x {} +

      - name: Setup Python venv & Pre-Flight Check
        env:
          GAME_URL: ${{ secrets.GAME_URL }}
          KEYS_URL: ${{ secrets.KEYS_URL }}
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
          VH_URL: ${{ secrets.VH_URL }}
          USE_UPDATE: ${{ inputs.use_update }}
          USE_VH: ${{ inputs.use_vh }}
        run: |
          set -euo pipefail
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          if [ -f src/.github/requirements/tools.txt ]; then pip install -r src/.github/requirements/tools.txt; fi
          pip install gdown requests lz4 "capstone>=5,<6" fonttools nsz zbic pycryptodome zstandard pillow "backports.zstd; python_version < '3.14'"
          test -n "$GAME_URL"
          test -n "$KEYS_URL"
          if [ "$USE_UPDATE" = "true" ]; then test -n "$UPDATE_URL"; fi
          if [ "$USE_VH" = "true" ]; then test -n "$VH_URL"; fi

      - name: Download Game, Update, Keys & VH
        env:
          GAME_URL: ${{ secrets.GAME_URL }}
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
          KEYS_URL: ${{ secrets.KEYS_URL }}
          VH_URL: ${{ secrets.VH_URL }}
          USE_UPDATE: ${{ inputs.use_update }}
          USE_VH: ${{ inputs.use_vh }}
        run: |
          set -euo pipefail
          source .venv/bin/activate
          mkdir -p game_files keys_dir vh_raw out_ipa
          curl -sSL https://raw.githubusercontent.com/ltsdw/gofile-downloader/main/gofile-downloader.py -o gofile-downloader.py

          download_any() {
            local url="$1"
            local out_dir="$2"
            local flatten="${3:-true}"
            if [[ "$url" == *"gofile.io"* ]]; then
              GF_DOWNLOAD_DIR="$out_dir" python3 gofile-downloader.py "$url"
            elif [[ "$url" == *"drive.google.com"* ]]; then
              if [[ "$url" == *"/folders/"* ]]; then
                (cd "$out_dir" && gdown --folder "$url")
              else
                local fid
                fid="$(echo "$url" | sed -nE 's/.*\/d\/([^\/?]+).*/\1/p; s/.*[?&]id=([^&]+).*/\1/p' | head -n 1)"
                if [ -n "$fid" ]; then (cd "$out_dir" && gdown "https://drive.google.com/uc?id=${fid}"); else (cd "$out_dir" && gdown "$url"); fi
              fi
            else
              (cd "$out_dir" && curl -fSL -O -J "$url")
            fi
            if [ "$flatten" = "true" ]; then
              find "$out_dir" -mindepth 2 -type f -exec mv -f {} "$out_dir"/ \;
              find "$out_dir" -mindepth 1 -type d -empty -delete
            fi
          }

          download_any "$KEYS_URL" "keys_dir" "true"
          download_any "$GAME_URL" "game_files" "true"
          if [ "$USE_UPDATE" = "true" ] && [ -n "$UPDATE_URL" ]; then download_any "$UPDATE_URL" "game_files" "true"; fi

          if [ "$USE_VH" = "true" ] && [ -n "$VH_URL" ]; then
            download_any "$VH_URL" "vh_raw" "false"
            mkdir -p vh_raw/unpacked
            while IFS= read -r -d '' arc; do
              7z x -y "$arc" -ovh_raw/unpacked >/dev/null
            done < <(find vh_raw -maxdepth 3 -type f \( -iname "*.zip" -o -iname "*.rar" -o -iname "*.7z" \) -print0)
          fi

      - name: Build IPA (Universal VH + 60FPS + Gofile)
        env:
          IPA_NAME: ${{ inputs.ipa_name }}
          CREDIT_TEXT: ${{ inputs.credit_text }}
          PACK_MODE: ${{ inputs.packaging_mode }}
          USE_VH: ${{ inputs.use_vh }}
          ENABLE_60FPS: ${{ inputs.enable_60fps }}
          ENABLE_RAM: ${{ inputs.enable_ram_unlock }}
        run: |
          set -euo pipefail
          source .venv/bin/activate
          export ROOT="$PWD"
          PROD_KEYS="$(find "$ROOT/keys_dir" -type f -iname "*prod.keys*" | head -n 1)"
          if [ -z "$PROD_KEYS" ]; then PROD_KEYS="$(find "$ROOT/keys_dir" -type f -iname "*.keys" | head -n 1)"; fi
          test -n "$PROD_KEYS"
          export PROD_KEYS

          if [ -f "$ROOT/src/dm/gfx/tools/dmsh_chain.py" ]; then
            (cd "$ROOT/src" && python3 dm/gfx/tools/dmsh_chain.py --update-lock) || true
          fi

          cat > "$ROOT/miao_env.txt" <<EOF
          DM_ALIAS_SIZE=0x180000000
          EOF
          if [ "$ENABLE_60FPS" = "true" ]; then
            cat >> "$ROOT/miao_env.txt" <<EOF
          DM_PRESENT_INTERVAL=display
          DM_FPS_TARGET=60
          EOF
          fi

          ENT_ENV=""
          if [ "$ENABLE_RAM" = "true" ] && [ -f "$ROOT/entitlements.plist" ]; then ENT_ENV="DM_ENTITLEMENTS=$ROOT/entitlements.plist"; fi
          ROMFS_ARGS="--romfs separate"
          if [ "$PACK_MODE" = "bundle" ]; then ROMFS_ARGS=""; fi

          HELP_OUT="$(cd "$ROOT/src" && python3 scripts/build_ipa_from_nsp.py --help 2>&1 || true)"
          NO_HEAP_ARG=""; echo "$HELP_OUT" | grep -q -- "--no-heap-check" && NO_HEAP_ARG="--no-heap-check"
          KEEP_EXT_ARG=""; echo "$HELP_OUT" | grep -q -- "--keep-extracted" && KEEP_EXT_ARG="--keep-extracted"
          ENV_FILE_ARG=""; echo "$HELP_OUT" | grep -q -- "--env-file" && ENV_FILE_ARG="--env-file $ROOT/miao_env.txt"

          run_nx_build() {
            (cd "$ROOT/src" && env $ENT_ENV python3 scripts/build_ipa_from_nsp.py "$ROOT/game_files" \
              -k "$PROD_KEYS" --allow-other-metal $NO_HEAP_ARG $KEEP_EXT_ARG $ENV_FILE_ARG $ROMFS_ARGS -o "$ROOT/out_ipa/$IPA_NAME")
          }

          run_nx_build
          rm -f "$ROOT/.need_repack"

          if [ "$ENABLE_60FPS" = "true" ]; then
            python3 - <<'PY'
          import os, glob
          root = os.environ["ROOT"]
          for tsv in glob.glob(os.path.join(root, "game_files", "*_build", "profile", "*", "game.tsv")):
              lines = open(tsv, encoding="utf-8").read().splitlines()
              overrides = {"present_interval": "display", "fps_target": "60"}
              seen, out = set(), []
              for ln in lines:
                  s = ln.strip()
                  if s and not s.startswith("#") and s.split()[0] in overrides:
                      k = s.split()[0]; out.append(f"{k}\t{overrides[k]}"); seen.add(k)
                  else:
                      out.append(ln)
              for k, v in overrides.items():
                  if k not in seen: out.append(f"{k}\t{v}")
              open(tsv, "w", encoding="utf-8").write("\n".join(out) + "\n")
              open(os.path.join(root, ".need_repack"), "w").write("1")
          PY
          fi

          if [ "$USE_VH" = "true" ]; then
            python3 - <<'PY'
          import os, sys, glob, shutil, subprocess
          root = os.environ["ROOT"]
          prod_keys = os.environ["PROD_KEYS"]
          vh_raw = os.path.join(root, "vh_raw")
          nx_extract = os.path.join(root, "src", "dm", "tools", "nx_extract_bin", "nx_extract")
          romfs_tool = os.path.join(root, "src", "dm", "tools", "romfs_image.py")
          search_base = os.path.join(vh_raw, "unpacked") if os.path.isdir(os.path.join(vh_raw, "unpacked")) else vh_raw
          vh_romfs_root = None
          for dp, dns, _ in os.walk(search_base):
              for d in dns:
                  if d.lower() == "romfs":
                      vh_romfs_root = os.path.join(dp, d); break
              if vh_romfs_root: break
          if not vh_romfs_root:
              vh_romfs_root = search_base

          def overlay_tree(src_root, dst_root):
              ow, add = 0, 0
              for dp, _, fns in os.walk(src_root):
                  for fn in fns:
                      if fn.startswith("._") or fn == ".DS_Store" or fn.lower().endswith((".zip", ".rar", ".7z")): continue
                      sf = os.path.join(dp, fn)
                      parts = os.path.relpath(sf, src_root).split(os.sep)
                      cur = dst_root
                      for part in parts[:-1]:
                          m = next((e for e in os.listdir(cur) if e.lower() == part.lower() and os.path.isdir(os.path.join(cur, e))), None) if os.path.isdir(cur) else None
                          cur = os.path.join(cur, m or part)
                          os.makedirs(cur, exist_ok=True)
                      tname = parts[-1]
                      ex = False
                      if os.path.isdir(cur):
                          m = next((e for e in os.listdir(cur) if e.lower() == tname.lower() and os.path.isfile(os.path.join(cur, e))), None)
                          if m: tname = m; ex = True
                      shutil.copy2(sf, os.path.join(cur, tname))
                      ow += 1 if ex else 0; add += 0 if ex else 1
              return ow, add

          vers = sorted(glob.glob(os.path.join(root, "game_files", "*_build", "extract", "v*")))
          if not vers: sys.exit(1)
          ver_dir = vers[-1]
          romfs_dir = next((os.path.join(ver_dir, e) for e in os.listdir(ver_dir) if e.lower() == "romfs" and os.path.isdir(os.path.join(ver_dir, e))), None)
          romfs_img = next((os.path.join(ver_dir, e) for e in os.listdir(ver_dir) if e.lower() == "romfs.img" and os.path.isfile(os.path.join(ver_dir, e))), None)

          if romfs_dir:
              ow, add = overlay_tree(vh_romfs_root, romfs_dir)
              if ow + add == 0: sys.exit(1)
          elif romfs_img:
              cands = sorted(set(sum([glob.glob(os.path.join(root, "game_files", p)) + glob.glob(os.path.join(root, "game_files", "*_build", "nsp", p)) for p in ("*.nsp", "*.NSP", "*.xci", "*.XCI")], [])))
              base_pkg, upd_pkg, max_v = None, None, -1
              for pkg in cands:
                  out_t = subprocess.run([nx_extract, prod_keys, "--contents", pkg], capture_output=True, text=True).stdout
                  vnum = max([int(t[1:]) for t in out_t.split() if t.startswith("v") and t[1:].isdigit()] + [0])
                  if vnum > 0 or "Patch" in out_t:
                      if vnum >= max_v: max_v = vnum; upd_pkg = pkg
                  elif base_pkg is None or os.path.getsize(pkg) > os.path.getsize(base_pkg):
                      base_pkg = pkg
              if base_pkg is None: base_pkg = max(cands, key=os.path.getsize)
              if upd_pkg == base_pkg: upd_pkg = None
              stage = os.path.join(root, "vh_stage")
              shutil.rmtree(stage, ignore_errors=True); os.makedirs(stage, exist_ok=True)
              subprocess.run([nx_extract, prod_keys, base_pkg, upd_pkg or "-", stage], check=True)
              s_romfs = next((os.path.join(stage, e) for e in os.listdir(stage) if e.lower() == "romfs"), None)
              if not s_romfs: sys.exit(1)
              ow, add = overlay_tree(vh_romfs_root, s_romfs)
              if ow + add == 0: sys.exit(1)
              tmp_img = romfs_img + ".vh.tmp"
              r1 = subprocess.run([sys.executable, romfs_tool, s_romfs, tmp_img])
              if r1.returncode != 0 or not os.path.isfile(tmp_img):
                  subprocess.run([sys.executable, romfs_tool, "pack", s_romfs, tmp_img], check=True)
              os.replace(tmp_img, romfs_img)
              shutil.rmtree(stage, ignore_errors=True)
          else:
              sys.exit(1)
          open(os.path.join(root, ".need_repack"), "w").write("1")
          PY
          fi

          if [ -f "$ROOT/.need_repack" ]; then
            rm -f "$ROOT/out_ipa/$IPA_NAME" "$ROOT/out_ipa/$IPA_NAME.idx"
            run_nx_build
          fi

          if [ "$PACK_MODE" = "separate_both" ]; then
            ROMFS_IMG="$(find "$ROOT/game_files" "$ROOT/src" -maxdepth 6 -type f -iname "RomFS.img" | head -n 1)"
            if [ -n "$ROMFS_IMG" ]; then cp -f "$ROMFS_IMG" "$ROOT/out_ipa/romfs.img"; fi
          fi

          mkdir -p "$ROOT/tmp_ipa"
          unzip -q "$ROOT/out_ipa/$IPA_NAME" -d "$ROOT/tmp_ipa"
          PLIST="$(find "$ROOT/tmp_ipa/Payload" -maxdepth 2 -name "Info.plist" | head -n 1)"
          if [ -n "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright $CREDIT_TEXT" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSHumanReadableCopyright string $CREDIT_TEXT" "$PLIST"
            rm -f "$ROOT/out_ipa/$IPA_NAME"
            (cd "$ROOT/tmp_ipa" && zip -qry "$ROOT/out_ipa/$IPA_NAME" Payload)
          fi
          rm -rf "$ROOT/tmp_ipa"

          SERVER="$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')"
          echo "## Download Links ($PACK_MODE)" >> "$GITHUB_STEP_SUMMARY"
          for f in "$ROOT/out_ipa"/*; do
            if [ -f "$f" ] && [[ "$f" != *.idx ]]; then
              RESP="$(curl -s -F "file=@$f" "https://${SERVER}.gofile.io/contents/uploadfile")"
              LINK="$(echo "$RESP" | jq -r '.data.downloadPage')"
              echo "- **$(basename "$f")**: $LINK" >> "$GITHUB_STEP_SUMMARY"
              echo "Uploaded $(basename "$f") -> $LINK"
            fi
          done
